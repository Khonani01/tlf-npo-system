
name: TLF Connect CI

on:
  push:
    branches:
      - dev
      - "feature/**"
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
 
  php-checks:
    name: Check PHP Code
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root_password
          MYSQL_DATABASE: tlf_ci_test
          MYSQL_USER: tlf_test
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          coverage: none

      - name: Check PHP syntax
        run: |
          find api -type f -name '*.php' -print0 |
          xargs -0 -r -n1 php -l
          
      - name: Import test database schema
        env:
          MYSQL_PWD: test_password
        run: |
          mysql --host=127.0.0.1 --port=3306 --user=tlf_test tlf_ci_test < api/tests/schema.sql
          mysql --host=127.0.0.1 --port=3306 --user=tlf_test tlf_ci_test -e "SHOW TABLES;"
          
      - name: Run automated API smoke tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: tlf_ci_test
          DB_USER: tlf_test
          DB_PASS: test_password
          API_BASE_URL: http://127.0.0.1:8000
        run: |
          php -S 127.0.0.1:8000 -t api > /tmp/tlf-api.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/health.php > /dev/null; then
              break
            fi
            sleep 1
          done

          php api/tests/smoke.php
          php api/tests/functional.php



  android-build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

     
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
         sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        working-directory: android-app
        run: bash ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tlf-connect-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
